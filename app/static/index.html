<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>clipcut</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>clipcut</h1>
    <p class="tagline">แปลงคลิป 16:9 เป็น 9:16 สำหรับ TikTok</p>
  </header>

  <main>
    <section class="panel">
      <h2>1. เลือกคลิป</h2>
      <p class="hint">วางไฟล์ไว้ใน <code>media/input/</code> แล้วกดปุ่ม หรือลากไฟล์มาวางตรงนี้</p>

      <div id="dropzone" class="dropzone">
        <input type="file" id="file-input" accept="video/*" hidden />
        <button type="button" id="browse">เลือกไฟล์จากเครื่อง</button>
        <span class="drop-hint">หรือลากไฟล์มาวาง</span>
      </div>

      <div id="sources" class="sources"></div>
    </section>

    <section class="panel" id="result-panel" hidden>
      <h2>2. ซีนที่พบ</h2>
      <div id="job-meta" class="meta"></div>
      <div id="progress-wrap" class="progress-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="job-step" class="step"></p>
      <div id="shots" class="shots"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
