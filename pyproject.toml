[project]
name = "clipcut"
version = "0.1.0"
description = "แปลงคลิป 16:9 เป็น 9:16 สำหรับ TikTok แบบกึ่งอัตโนมัติ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "scenedetect>=0.7",
    "opencv-python>=4.10",
    "yt-dlp>=2024.10.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
